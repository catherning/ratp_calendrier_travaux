name: Deploy Cloud Run Job

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - "station_filtering"
    # Only runs when the image/code pipeline pushes a new DOCKER_IMAGE.

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-scrape
  cancel-in-progress: false

jobs:
  deploy-cloud-run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
      DEPLOY_CONFIG_PATH: deploy/gcp/backend-scrape.config.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: config
        name: Load deploy config
        shell: bash
        run: |
          set -euo pipefail

          [[ -f "${DEPLOY_CONFIG_PATH}" ]] || { echo "Missing deploy config: ${DEPLOY_CONFIG_PATH}"; exit 1; }

          python3 - "${DEPLOY_CONFIG_PATH}" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          config_path = sys.argv[1]
          with open(config_path, "r", encoding="utf-8") as handle:
              config = json.load(handle)

          outputs = {
              "project_id": config["projectId"],
              "region": config["region"],
              "workload_identity_provider": config["githubActions"]["workloadIdentityProvider"],
              "deployer_service_account": config["githubActions"]["deployerServiceAccount"],
              "job_name": config["cloudRunJob"]["name"],
              "scheduler_name": config["cloudScheduler"]["name"],
          }

          for key, value in outputs.items():
              print(f"{key}={value}")
            PY

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOCKER_IMAGE}" ]] || { echo "Missing repo var: DOCKER_IMAGE"; exit 1; }
          [[ -n "${{ steps.config.outputs.project_id }}" ]] || { echo "Missing config value: projectId"; exit 1; }
          [[ -n "${{ steps.config.outputs.region }}" ]] || { echo "Missing config value: region"; exit 1; }
          [[ -n "${{ steps.config.outputs.workload_identity_provider }}" ]] || { echo "Missing config value: githubActions.workloadIdentityProvider"; exit 1; }
          [[ -n "${{ steps.config.outputs.deployer_service_account }}" ]] || { echo "Missing config value: githubActions.deployerServiceAccount"; exit 1; }

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.deployer_service_account }}
          project_id: ${{ steps.config.outputs.project_id }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.config.outputs.project_id }}

      - name: Deploy Cloud Run job
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy_cloud_run_job.sh "${DEPLOY_CONFIG_PATH}" "${DOCKER_IMAGE}"
