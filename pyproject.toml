[project]
name = "ratp-calendrier-travaux"
version = "0.2.0"
description = "Paris transit disruptions → ICS / Google Calendar"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "icalendar>=6.1.1",
    "python-dotenv>=1.0.1",
    "cachetools>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.10.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
